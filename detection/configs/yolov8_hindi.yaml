# YOLOv8 configuration for Hindi handwritten word detection
# Fine-tuning on Pratham ASER document images

# Dataset paths (update to your local paths)
path: ../data/yolo_dataset       # root directory
train: images/train               # train images (relative to path)
val: images/val                   # val images (relative to path)
test: images/test                 # test images (relative to path)

# Classes — single class: handwritten word region
nc: 1
names:
  0: word

# Hyperparameters (tuned for document-image detection)
# Training
epochs: 100
batch: 16
imgsz: 640
patience: 20                      # early stopping patience
save_period: 10                   # save checkpoint every N epochs
workers: 4

# Optimiser
optimizer: AdamW
lr0: 0.001
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# Augmentation — document-safe augmentations only
# NOTE: horizontal flip disabled — flipping Devanagari script corrupts semantics
fliplr: 0.0                       # MUST stay 0.0 for Devanagari
flipud: 0.0
degrees: 5.0                      # slight rotation
translate: 0.1
scale: 0.3
shear: 2.0
perspective: 0.0001
mosaic: 0.5
mixup: 0.0
copy_paste: 0.0

# Document-specific augmentation (brightness/contrast for scanned docs)
hsv_h: 0.0                        # no hue shift (greyscale docs)
hsv_s: 0.0                        # no saturation shift
hsv_v: 0.4                        # brightness variation (simulates scan quality)

# Model selection — can be overridden at CLI
model: yolov8m.pt                 # medium model; use yolov8s.pt for faster training

# IoU threshold for NMS
iou: 0.45
conf: 0.25

# Evaluation
project: runs/detect
name: hindi_words
exist_ok: false
plots: true
